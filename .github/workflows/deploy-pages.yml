# DompetKu — deploy ke GitHub Pages.
# Setiap push ke main membangun dist/ dan menerbitkannya.
name: Deploy DompetKu

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # The wait step below lists this run's artifacts; without it the
  # token cannot see them.
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      # deploy-pages asks GitHub for the artifact the moment the upload
      # finishes, and the list API sometimes still returns 0 for a few
      # seconds after a successful upload — three runs in a row failed
      # that way (2026-11-25). Wait until the artifact is actually
      # visible before deploying, instead of racing it.
      - name: Wait for Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 30); do
            count=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq '[.artifacts[] | select(.name == "github-pages")] | length')
            if [ "$count" = "1" ]; then
              echo "github-pages artifact is visible."
              exit 0
            fi
            echo "artifact not visible yet (attempt $i/30), waiting…"
            sleep 10
          done
          echo "github-pages artifact never became visible." >&2
          exit 1
      # deploy-pages@v4 finds the artifact through the artifact
      # service's own listing (Twirp), which has been returning 0 for
      # hours (2026-11-25) even right after a successful upload — the
      # wait step above proves the REST API sees the artifact
      # immediately, so the listing deploy-pages uses is what's broken.
      # This step does what deploy-pages does (create a Pages
      # deployment from the artifact, then poll it), but reads the
      # artifact id from the REST API. If the artifact service
      # recovers, this can go back to actions/deploy-pages@v4.
      - name: Deploy to GitHub Pages
        id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifact_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq '.artifacts[] | select(.name == "github-pages") | .id' | head -1)
          if [ -z "$artifact_id" ]; then
            echo "github-pages artifact not found via REST API." >&2
            exit 1
          fi
          echo "artifact id: $artifact_id"
          id_token=$(curl -s -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}" | jq -r .value)
          if [ -z "$id_token" ] || [ "$id_token" = "null" ]; then
            echo "could not mint an OIDC token." >&2
            exit 1
          fi
          build_version="${GITHUB_SHA}-${GITHUB_RUN_ATTEMPT}"
          response=$(curl -s -f -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d "{\"artifact_id\": $artifact_id, \"pages_build_version\": \"$build_version\", \"oidc_token\": \"$id_token\"}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/deployments")
          deployment_id=$(echo "$response" | jq -r .id)
          page_url=$(echo "$response" | jq -r .page_url)
          echo "deployment id: $deployment_id"
          echo "page_url=$page_url" >> "$GITHUB_OUTPUT"
          for i in $(seq 1 60); do
            status=$(gh api "repos/${GITHUB_REPOSITORY}/pages/deployments/${deployment_id}" --jq .status)
            echo "deployment status: $status (attempt $i/60)"
            case "$status" in
              deployment_succeeded)
                echo "Pages deployment succeeded."
                exit 0
                ;;
              deployment_failed|deployment_perms_error|deployment_content_failed|deployment_cancelled|deployment_lost)
                echo "Pages deployment failed: $status" >&2
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "Pages deployment did not finish in time." >&2
          exit 1
