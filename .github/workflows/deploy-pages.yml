# DompetKu — deploy ke GitHub Pages.
# Setiap push ke main membangun dist/ dan menerbitkannya.
name: Deploy DompetKu

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # The wait step below lists this run's artifacts; without it the
  # token cannot see them.
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      # deploy-pages asks GitHub for the artifact the moment the upload
      # finishes, and the list API sometimes still returns 0 for a few
      # seconds after a successful upload — three runs in a row failed
      # that way (2026-11-25). Wait until the artifact is actually
      # visible before deploying, instead of racing it.
      - name: Wait for Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 30); do
            count=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq '[.artifacts[] | select(.name == "github-pages")] | length')
            if [ "$count" = "1" ]; then
              echo "github-pages artifact is visible."
              exit 0
            fi
            echo "artifact not visible yet (attempt $i/30), waiting…"
            sleep 10
          done
          echo "github-pages artifact never became visible." >&2
          exit 1
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
