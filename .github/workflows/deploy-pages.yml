# DompetKu — deploy ke GitHub Pages.
# Setiap push ke main membangun dist/ dan menerbitkannya.
# Two jobs, like Porto: the build uploads the artifact and the deploy
# job (a fresh runner, about a minute later) publishes it. A single job
# deploys 0.35s after the upload, and GitHub's artifact listing lags by
# seconds — deploy-pages then finds 0 artifacts (2026-11-25, eight
# failed runs in a row, while Porto's two-job deploy went green the
# same hour with a 7.8s gap). The 60s sleep gives the listing margin.
name: Deploy DompetKu

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # Give GitHub's artifact listing time to see the upload before
      # deploy-pages asks for it (see the header comment).
      - name: Wait for the artifact listing
        run: sleep 60
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
